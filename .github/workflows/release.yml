name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_GITHUB_OWNER: ${{ vars.RELEASE_GITHUB_OWNER || github.repository_owner }}
      RELEASE_GITHUB_REPO: ${{ vars.RELEASE_GITHUB_REPO || github.event.repository.name }}
      GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version and release destination
        run: npm run release:verify

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npm run desktop:dist

      - name: Publish and verify GitHub Release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/Relay-Setup-$version-x64.exe"
          $artifacts = @(
            $installer
            "$installer.blockmap"
            "release/latest.yml"
          )

          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Required release artifact is missing: $artifact"
            }
          }

          $repository = "$env:RELEASE_GITHUB_OWNER/$env:RELEASE_GITHUB_REPO"
          gh release view $env:RELEASE_TAG --repo $repository *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @artifacts --repo $repository --clobber
          } else {
            gh release create $env:RELEASE_TAG @artifacts --repo $repository --title $version --generate-notes --latest
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release upload failed for $env:RELEASE_TAG."
          }

          $uploadedAssets = @(gh release view $env:RELEASE_TAG --repo $repository --json assets --jq '.assets[].name')
          foreach ($artifact in $artifacts) {
            $assetName = Split-Path -Leaf $artifact
            if ($uploadedAssets -notcontains $assetName) {
              throw "GitHub release is incomplete; missing uploaded asset: $assetName"
            }
          }
